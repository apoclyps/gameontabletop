openapi: 3.1.0
info:
  title: Game On Tabletop API
  description: REST API for Game On Tabletop — a platform for organising tabletop
    game nights, tracking game collections, scheduling events, and managing group
    RSVPs.
  version: 1.0.0
paths:
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Register a new account
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Email or username already registered
        '422':
          description: Validation error
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Log in and obtain JWT tokens
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified or account disabled
        '422':
          description: Validation error
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Log out (client-side token discard)
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh access token using a refresh token
      operationId: refresh_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/verify-email:
    get:
      tags:
      - auth
      summary: Verify email address via token from confirmation email
      operationId: verify_email_api_auth_verify_email_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired verification token
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/forgot-password:
    post:
      tags:
      - auth
      summary: Request a password reset email
      description: Always returns 200 to prevent email enumeration. A reset link is
        sent only if the address is registered.
      operationId: forgot_password_api_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/reset-password:
    post:
      tags:
      - auth
      summary: Reset password using a reset token
      operationId: reset_password_api_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired reset token
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/bgg/games:
    get:
      tags:
      - bgg
      summary: Fetch BGG game details by comma-separated IDs (max 50)
      operationId: get_bgg_games_api_bgg_games_get
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: string
          title: Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/BGGGameResponse'
                title: Response Get Bgg Games Api Bgg Games Get
        '400':
          description: Invalid or missing IDs
        '502':
          description: BGG API error
        '503':
          description: BGG token not configured
        '504':
          description: BGG API timed out
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/bgg/search:
    get:
      tags:
      - bgg
      summary: Search BGG for board games by title
      operationId: search_bgg_api_bgg_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BGGSearchResult'
                title: Response Search Bgg Api Bgg Search Get
        '400':
          description: Query too short
        '502':
          description: BGG API error
        '503':
          description: BGG token not configured
        '504':
          description: BGG API timed out
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/me:
    get:
      tags:
      - users
      summary: Get the authenticated user's profile
      operationId: get_profile_api_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
      security:
      - HTTPBearer: []
    patch:
      tags:
      - users
      summary: Update the authenticated user's profile
      operationId: update_profile_api_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
      security:
      - HTTPBearer: []
  /api/users/me/avatar:
    post:
      tags:
      - users
      summary: Upload or replace the authenticated user's avatar image
      operationId: upload_avatar_api_users_me_avatar_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_avatar_api_users_me_avatar_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid file type or file too large
        '401':
          description: Unauthorized
        '502':
          description: Storage upload failed or not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/groups:
    get:
      tags:
      - groups
      summary: List groups the authenticated user belongs to
      operationId: list_groups_api_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GroupResponse'
                type: array
                title: Response List Groups Api Groups Get
        '401':
          description: Unauthorized
      security:
      - HTTPBearer: []
    post:
      tags:
      - groups
      summary: Create a new group
      operationId: create_group_api_groups_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/groups/{group_id}:
    get:
      tags:
      - groups
      summary: Get a group by ID
      operationId: get_group_api_groups__group_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this group
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - groups
      summary: Update group settings (organiser only)
      operationId: update_group_api_groups__group_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not a member or not an organiser
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - groups
      summary: Delete a group (owner only)
      operationId: delete_group_api_groups__group_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthorized
        '403':
          description: Not the owner
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/groups/{group_id}/members:
    get:
      tags:
      - groups
      summary: List members of a group
      operationId: list_members_api_groups__group_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
                title: Response List Members Api Groups  Group Id  Members Get
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this group
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/groups/{group_id}/members/{user_id}:
    delete:
      tags:
      - groups
      summary: Remove a member from a group (organiser only)
      operationId: remove_member_api_groups__group_id__members__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Member not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/groups/{group_id}/invites:
    post:
      tags:
      - groups
      summary: Create a group invite link (organiser only)
      operationId: create_invite_api_groups__group_id__invites_post
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - groups
      summary: List active invite links for a group (organiser only)
      operationId: list_invites_api_groups__group_id__invites_get
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteResponse'
                title: Response List Invites Api Groups  Group Id  Invites Get
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/invites/{token}:
    get:
      tags:
      - groups
      summary: Preview a group invite before accepting
      operationId: preview_invite_api_invites__token__get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          description: Invite not found or expired
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/invites/{token}/accept:
    post:
      tags:
      - groups
      summary: Accept a group invite and join the group
      operationId: accept_invite_api_invites__token__accept_post
      security:
      - HTTPBearer: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteResponse'
        '401':
          description: Unauthorized
        '404':
          description: Invite not found or expired
        '410':
          description: Invite already used
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/groups/{group_id}/locations:
    get:
      tags:
      - locations
      summary: List locations for a group
      operationId: list_locations_api_groups__group_id__locations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponse'
                title: Response List Locations Api Groups  Group Id  Locations Get
        '401':
          description: Unauthorized
        '403':
          description: Not a member of this group
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - locations
      summary: Create a location for a group (organiser only)
      operationId: create_location_api_groups__group_id__locations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/locations/{location_id}:
    patch:
      tags:
      - locations
      summary: Update a location (organiser only)
      operationId: update_location_api_locations__location_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Location Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Location not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - locations
      summary: Delete a location (organiser only)
      operationId: delete_location_api_locations__location_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Location Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Location not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/groups/{group_id}/series:
    post:
      tags:
      - series
      summary: Create a recurring game night series for a group (organiser only)
      operationId: create_series_api_groups__group_id__series_post
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - series
      summary: List series for a group
      operationId: list_series_api_groups__group_id__series_get
      security:
      - HTTPBearer: []
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesResponse'
                title: Response List Series Api Groups  Group Id  Series Get
        '401':
          description: Unauthorized
        '403':
          description: Not a member
        '404':
          description: Group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/series/{series_id}:
    get:
      tags:
      - series
      summary: Get a series by ID
      operationId: get_series_api_series__series_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: series_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Series Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not a member
        '404':
          description: Series not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - series
      summary: Update a series (organiser only)
      operationId: update_series_api_series__series_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: series_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Series Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not an organiser
        '404':
          description: Series not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/series/{series_id}/occurrences:
    get:
      tags:
      - series
      summary: List occurrences for a series
      operationId: list_occurrences_api_series__series_id__occurrences_get
      security:
      - HTTPBearer: []
      parameters:
      - name: series_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Series Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceResponse'
                title: Response List Occurrences Api Series  Series Id  Occurrences
                  Get
        '401':
          description: Unauthorized
        '403':
          description: Not a member
        '404':
          description: Series not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - occurrences
      summary: Create a one-off occurrence for a series (organiser only)
      operationId: create_occurrence_api_series__series_id__occurrences_post
      security:
      - HTTPBearer: []
      parameters:
      - name: series_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Series Id
      requestBody:
        required: true
